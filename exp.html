<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrance Papers</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

.file {
    padding: 12px;
    margin: 10px 0;
    background: #e8f3ff;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

a {
    text-decoration: none;
    color: blue;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <h2 id="title"></h2>
    <div id="list"></div>
</div>

<script>
fetch("data.json")
.then(res => res.json())
.then(data => {

    const block = data.entrance_papers;

    document.getElementById("title").innerText = block.title;

    const list = document.getElementById("list");

    block.files.forEach(file => {

        const fullPath = "papers/" + file;

        const div = document.createElement("div");
        div.className = "file";

        div.innerHTML = `
            <span>${file}</span>
            <a href="${fullPath}" target="_blank">Open</a>
        `;

        list.appendChild(div);
    });

});
</script>

</body>
</html>

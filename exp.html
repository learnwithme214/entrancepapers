<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrance Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body, html {
    height: 100%;
}

/* Background image */
body {
    background: url('gu.jpg') no-repeat center center/cover;
}

/* Dark overlay */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

/* Center container */
.container {
    position: relative;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    text-align: center;
}

/* Button styling */
.btn {
    padding: 400px 800px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #00c6ff;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #0072ff;
    transform: scale(1.05);
}
</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">
    <h1>Welcome</h1>
    <p>Enter to continue</p>
    <button class="btn" onclick="location.href='home.html'">Enter</button>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Previous Year Papers</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;

    background:url("gu.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.5);
    padding:20px;
}

h1{
    color:white;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
}

#entranceBtn{
    margin-top:100px;
}

#searchSection{
    display:none;
}

#searchInput{
    width:80%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    border-radius:8px;
    border:none;
}

.paper{
    background:white;
    margin:10px auto;
    padding:12px;
    width:80%;
    max-width:700px;
    border-radius:10px;
}

.paper a{
    text-decoration:none;
    color:#0077ff;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="overlay">

<h1>Previous Year Papers</h1>

<button id="entranceBtn" onclick="openEntrance()">
    Entrance Papers
</button>

<div id="searchSection">

    <button onclick="goBack()">⬅ Back</button>

    <br><br>

    <input
        type="text"
        id="searchInput"
        placeholder="Search Entrance Papers..."
        onkeyup="searchFiles()"
    >

    <div id="fileList"></div>

</div>

</div>

<script>

let allFiles=[];

function openEntrance(){

    document.getElementById("entranceBtn").style.display="none";

    document.getElementById("searchSection").style.display="block";

    loadFiles();
}

function goBack(){

    document.getElementById("searchSection").style.display="none";

    document.getElementById("entranceBtn").style.display="inline-block";

    document.getElementById("searchInput").value="";
}

function loadFiles(){

    fetch("entrance.json")
    .then(res=>res.json())
    .then(data=>{

        allFiles=data.entrance_papers.files;

        showFiles(allFiles);

    });
}

function showFiles(files){

    let html="";

    files.forEach(file=>{

        html+=`
        <div class="paper">
            <a href="papers/${file}" target="_blank">
                ${file}
            </a>
        </div>
        `;
    });

    document.getElementById("fileList").innerHTML=html;
}

function searchFiles(){

    let keyword=document
    .getElementById("searchInput")
    .value
    .toLowerCase();

    let filtered=allFiles.filter(file=>
        file.toLowerCase().includes(keyword)
    );

    showFiles(filtered);
}

</script>

</body>
</html>

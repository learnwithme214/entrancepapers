<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrance Portal</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Background */
body {
    background: url("bg.jpg") no-repeat center center/cover;
    overflow: hidden;
}

/* Dark overlay */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 0;
}

/* Center screens */
.screen {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    text-align: center;
}

/* Button */
.btn {
    margin-top: 20px;
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #00c6ff;
    color: white;
    cursor: pointer;
}

.btn:hover {
    background: #0072ff;
}

/* Papers UI */
.container {
    display: none;
    position: relative;
    z-index: 1;
    max-width: 500px;
    margin: auto;
    background: rgba(255,255,255,0.95);
    color: black;
    padding: 20px;
    border-radius: 10px;
}

.file {
    padding: 12px;
    margin: 10px 0;
    background: #e8f3ff;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
}

a {
    text-decoration: none;
    color: blue;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- 🔥 WELCOME SCREEN -->
<div class="screen" id="welcome">
    <h1>Welcome</h1>
    <p>Enter to continue</p>
    <button class="btn" onclick="enterSite()">Enter</button>
</div>

<!-- 📂 PAPERS SCREEN -->
<div class="container" id="papers">
    <h2 id="title"></h2>
    <div id="list"></div>
</div>

<script>
function enterSite() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("papers").style.display = "block";
}

/* JSON LOADER */
fetch("data.json")
.then(res => res.json())
.then(data => {

    const block = data.entrance_papers;

    document.getElementById("title").innerText = block.title;

    const list = document.getElementById("list");

    block.files.forEach(file => {

        const fullPath = "papers/" + file;

        const div = document.createElement("div");
        div.className = "file";

        div.innerHTML = `
            <span>${file}</span>
            <a href="${fullPath}" target="_blank">Open</a>
        `;

        list.appendChild(div);
    });

});
</script>

</body>
</html>

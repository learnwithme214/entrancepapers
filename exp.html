<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Entrance Papers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background-image:url("gu.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Welcome Screen */
#welcome{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    backdrop-filter:blur(6px);
    background:rgba(0,0,0,.35);
}

#welcome h1{
    color:white;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
}

/* Menu */
#menu{
    display:none;
    position:fixed;
    inset:0;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    width:300px;
}

/* Papers Page */
#papersPage{
    display:none;
    min-height:100vh;
    background:rgba(255,255,255,.95);
    padding:20px;
}

#search{
    width:100%;
    max-width:600px;
    padding:12px;
    margin:15px auto;
    display:block;
}

.paper{
    max-width:600px;
    margin:10px auto;
    padding:12px;
    background:#f2f2f2;
    border-radius:10px;
}

.paper a{
    text-decoration:none;
}
</style>
</head>

<body>

<div id="welcome">
    <h1>Welcome</h1>
    <button onclick="showMenu()">Enter</button>
</div>

<div id="menu">
    <div class="box">
        <h2>Menu</h2>
        <br>
        <button onclick="showPapers()">Entrance Papers</button>
    </div>
</div>

<div id="papersPage">
    <h2>Entrance Papers</h2>

    <input
        type="text"
        id="search"
        placeholder="Search papers..."
    >

    <div id="papers"></div>
</div>

<script>
let allFiles = [];

function showMenu(){
    document.getElementById("welcome").style.display="none";
    document.getElementById("menu").style.display="flex";
}

function showPapers(){
    document.getElementById("menu").style.display="none";
    document.getElementById("papersPage").style.display="block";
}

fetch("entrance.json")
.then(r => r.json())
.then(data => {
    allFiles = data.files;
    render(allFiles.slice(0,5)); // first 5 PDFs
});

function render(files){
    const container = document.getElementById("papers");
    container.innerHTML="";

    files.forEach(file=>{
        container.innerHTML += `
            <div class="paper">
                <a href="papers/${file}" target="_blank">${file}</a>
            </div>
        `;
    });
}

document.getElementById("search").addEventListener("input", e=>{
    const q = e.target.value.toLowerCase();

    const filtered = allFiles.filter(file =>
        file.toLowerCase().includes(q)
    );

    render(filtered);
});
</script>

</body>
</html>

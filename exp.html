<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrance Portal</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

/* Background image */
body {
    background-image: url("bg.jpg"); /* change this */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Dark overlay */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 0;
}

/* Center box */
.container {
    position: relative;
    z-index: 1;
    text-align: center;
    color: white;
}

/* Button */
.btn {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #00c6ff;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #0072ff;
    transform: scale(1.05);
}
</style>

</head>

<body>

<div class="container">
    <h1>Welcome</h1>
    <p>Enter to continue</p>
    <button class="btn" onclick="location.href='home.html'">Enter</button>
</div>

</body>
</html>

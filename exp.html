<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Previous Year Papers</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:url("gu.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.5);
    padding:20px;
}

/* Sliding Description */

.marquee{
    width:100%;
    overflow:hidden;
    white-space:nowrap;
    color:white;
    font-size:20px;
    font-weight:bold;
    padding:15px 0;
    background:rgba(255,255,255,0.15);
    border-radius:10px;
}

.marquee span{
    display:inline-block;
    padding-left:100%;
    animation:slide 27s linear infinite;
}

@keyframes slide{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
}

#entranceBtn{
    margin-top:120px;
}

#searchSection{
    display:none;
}

#searchInput{
    width:80%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
}

.paper{
    width:80%;
    max-width:700px;
    margin:10px auto;
    padding:12px;
    background:white;
    border-radius:10px;
}

.paper a{
    text-decoration:none;
    color:#0077ff;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="overlay">

<div class="marquee">
<span>
Welcome to the Entrance Papers Portal • Search Previous Year Entrance Papers Easily • New Papers Are Added Regularly • Use Keywords To Find Papers Quickly •
</span>
</div>

<button id="entranceBtn" onclick="openEntrance()">
Entrance Papers
</button>

<div id="searchSection">

<button onclick="goBack()">⬅ Back</button>

<br><br>

<input
type="text"
id="searchInput"
placeholder="Search Entrance Papers..."
onkeyup="searchFiles()">

<div id="fileList"></div>

</div>

</div>

<script>

let allFiles=[];

function openEntrance(){
    document.getElementById("entranceBtn").style.display="none";
    document.getElementById("searchSection").style.display="block";
    loadFiles();
}

function goBack(){
    document.getElementById("searchSection").style.display="none";
    document.getElementById("entranceBtn").style.display="inline-block";
    document.getElementById("searchInput").value="";
}

function loadFiles(){

fetch("entrance.json")
.then(response=>response.json())
.then(data=>{

allFiles=data.entrance_papers.files;

showFiles(allFiles);

});

}

function showFiles(files){

let html="";

files.forEach(file=>{

html+=`
<div class="paper">
<a href="papers/${file}" target="_blank">${file}</a>
</div>
`;

});

document.getElementById("fileList").innerHTML=html;

}

function searchFiles(){

let keyword=document.getElementById("searchInput").value.toLowerCase();

let filtered=allFiles.filter(file=>
file.toLowerCase().includes(keyword)
);

showFiles(filtered);

}

</script>

</body>
</html>

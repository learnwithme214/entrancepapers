<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Arial;
}

/* BACKGROUND */
body {
    background: url("bg.jpg") no-repeat center center/cover;
}

/* BLUR LAYER (welcome only) */
.blur {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(6px);
    background: rgba(0,0,0,0.3);
    z-index: 1;
}

/* CENTER BOX */
.center {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
    flex-direction: column;
}

/* BUTTON */
.btn {
    padding: 14px 28px;
    border: none;
    border-radius: 25px;
    background: #00c6ff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* MENU BOX */
.box {
    display: none;
    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 12px;
    text-align: center;
}

/* PAPERS PAGE */
#papers {
    display: none;
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.file {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    margin: 8px 0;
    background: #e8f3ff;
    border-radius: 8px;
}

/* SEARCH */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<!-- 🔥 WELCOME SCREEN -->
<div id="welcome">
    <div class="blur"></div>
    <div class="center">
        <h1 style="color:white; z-index:2;">Welcome</h1>
        <button class="btn" onclick="goMenu()">Enter</button>
    </div>
</div>

<!-- 🔥 MENU BOX -->
<div id="menu" class="center" style="display:none;">
    <div class="box">
        <h2>Menu</h2>
        <button class="btn" onclick="openPapers()">Entrance Papers</button>
    </div>
</div>

<!-- 🔥 PAPERS PAGE -->
<div id="papers">
    <h2>Entrance Papers</h2>
    <input type="text" id="search" placeholder="Search papers...">
    <div id="list">Loading...</div>
</div>

<script>

let files = [];

function goMenu() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("menu").style.display = "flex";
}

function openPapers() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("papers").style.display = "block";
}

/* LOAD JSON */
fetch("data.json")
.then(res => res.json())
.then(data => {

    files = data.entrance_papers.files.slice(0, 5); // first 5 only

    render(files);

});

/* RENDER FILES */
function render(list) {
    const box = document.getElementById("list");
    box.innerHTML = "";

    list.forEach(file => {
        const div = document.createElement("div");
        div.className = "file";

        div.innerHTML = `
            <span>${file}</span>
            <a href="papers/${file}" target="_blank">Open</a>
        `;

        box.appendChild(div);
    });
}

/* SEARCH */
document.getElementById("search").addEventListener("input", function() {
    const val = this.value.toLowerCase();

    const filtered = files.filter(f => 
        f.toLowerCase().includes(val)
    );

    render(filtered);
});

</script>

</body>
</html>
